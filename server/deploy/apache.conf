<VirtualHost *:80>
    ServerName gpt.slax.org
    Redirect permanent / https://gpt.slax.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName gpt.slax.org
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/gpt.slax.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gpt.slax.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    ProxyAddHeaders On
    ProxyPass / http://127.0.0.1:8787/ connectiontimeout=5 timeout=180
    ProxyPassReverse / http://127.0.0.1:8787/
    LimitRequestBody 2000000
    SetEnv no-gzip 1

    ErrorLog ${APACHE_LOG_DIR}/slax-ai-error.log
    CustomLog ${APACHE_LOG_DIR}/slax-ai-access.log combined
</VirtualHost>
