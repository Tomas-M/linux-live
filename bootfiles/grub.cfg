# Shared GRUB 2 menu for optical media and USB drives.
set default=0
set timeout=14
set gfxmode=auto
set gfxpayload=keep
if loadfont /boot/grub/unicode.pf2; then
   # Keep UEFI's GOP mode consistent with the framebuffer passed to Linux.
   if [ "$grub_platform" = "efi" ]; then
      insmod efi_gop
   else
      insmod all_video
   fi
   insmod gfxterm
   terminal_output gfxterm
   insmod png
   background_image /boot/bootlogo.png
fi

menuentry "Run Linux" {
   linux /boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 apparmor=0
   initrd /boot/initrfs.img
}

menuentry "Run Linux debug" {
   linux /boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 apparmor=0 debug
   initrd /boot/initrfs.img
}
