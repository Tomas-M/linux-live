# Both countdown and full menu use the same entries and configured default.
menuentry "Resume previous session automatically" {
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 perchdir=resume automount bootuuid=$bootuuid
   initrd /slax/boot/initrfs.img
}

menuentry "Choose session during startup" {
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 perchdir=ask automount bootuuid=$bootuuid
   initrd /slax/boot/initrfs.img
}

menuentry "Run Slax from RAM (copy to ram)" {
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 toram bootuuid=$bootuuid
   initrd /slax/boot/initrfs.img
}

menuentry "Start Slax in text mode only (no desktop)" {
   if [ "$grub_platform" = pc ]; then
      set gfxpayload=text
   fi
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 text nomodeset bootuuid=$bootuuid
   initrd /slax/boot/initrfs.img
}
