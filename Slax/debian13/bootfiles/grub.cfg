# Shared Slax menu for BIOS and UEFI, on optical media and USB drives.
set default=0
set timeout=-1
set timeout_style=menu
set gfxmode=auto
set gfxpayload=keep
# Pass the kernel's source filesystem identity through both menu environments.
set bootuuid=
probe --set=bootuuid --fs-uuid ($root)
export bootuuid
# Keep the same display settings in the nested startup screen.
export gfxmode gfxpayload default
# Stock GRUB returns from this nested countdown menu when Escape is pressed.
configfile /slax/boot/grub/autoboot.cfg
set timeout=-1
source /slax/boot/grub/graphics.cfg
set theme=/slax/boot/grub/theme.txt
export theme
source /slax/boot/grub/entries.cfg
