# Shared Slax menu for BIOS and UEFI, on optical media and USB drives.
set default=0
set timeout=-1
set timeout_style=menu
set gfxmode=auto
set gfxpayload=keep
# Keep the same display settings in the nested startup screen.
export gfxmode gfxpayload
if loadfont /slax/boot/grub/unicode.pf2; then
   # Keep UEFI's GOP mode consistent with the framebuffer passed to Linux.
   if [ "$grub_platform" = "efi" ]; then
      insmod efi_gop
   else
      insmod all_video
   fi
   insmod gfxterm
   insmod gfxmenu
   terminal_output gfxterm
   insmod png
   set theme=/slax/boot/grub/theme.txt
   export theme
fi

menuentry "Resume previous session" {
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 perchdir=resume automount
   initrd /slax/boot/initrfs.img
}

menuentry "Start a new session" {
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 automount perchdir=new
   initrd /slax/boot/initrfs.img
}

menuentry "Choose session during startup" {
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 perchdir=ask
   initrd /slax/boot/initrfs.img
}

menuentry "Run Slax from RAM (copy to RAM)" {
   linux /slax/boot/vmlinuz load_ramdisk=1 prompt_ramdisk=0 rw printk.time=0 consoleblank=0 quiet loglevel=0 vt.global_cursor_default=0 toram
   initrd /slax/boot/initrfs.img
}

# Esc leaves the initial countdown and opens this menu without a timeout.
configfile /slax/boot/grub/autoboot.cfg

