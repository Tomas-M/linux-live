! Slax fluxbox theme
! (c) Tomas Matejicek <www.slax.org>

! common settings
*font: Bitstream Vera Sans-9

! Startup sets the wallpaper; "none" would restore the last one too early.
background:             unset

toolbar.justify:                     left
toolbar.clock.justify:               right
window.justify:                      center
menu.title.justify:                  center
menu.frame.justify:                  left

! Window frames matched to Chromium's light theme.
window.font: DejaVu Sans-10:bold
window.borderWidth: 4
window.bevelWidth: 3
window.handleWidth: 0
window.roundCorners:
window.focus.backgroundColor: #d3e3fd
window.unfocus.backgroundColor: #dde3e9
window.focus.borderColor: #d3e3fd
window.unfocus.borderColor: #dde3e9

! Compact titles leave application toolbars inside their own windows.
window.title.height: 28
window.title.focus: flat solid
window.title.focus.color: #d3e3fd
window.title.unfocus: flat solid
window.title.unfocus.color: #dde3e9
window.label.focus: parentrelative
window.label.focus.textColor: #333338
window.label.unfocus: parentrelative
window.label.unfocus.textColor: #99999c
window.label.focus.font: DejaVu Sans-10:bold
window.label.unfocus.font: DejaVu Sans-10:bold

! Buttons gain a circular background only while hovered or pressed.
window.button.focus: flat solid
window.button.focus.color: #d3e3fd
window.button.focus.picColor: #5f6368
window.button.unfocus: flat solid
window.button.unfocus.color: #dde3e9
window.button.unfocus.picColor: #adb1b7
window.button.pressed: flat solid
window.button.pressed.color: #d3e3fd
window.button.pressed.picColor: #5f6368
window.close.pixmap: close-focus.png
window.close.unfocus.pixmap: close-unfocus.png
window.close.hover.pixmap: close-hover.png
window.close.unfocus.hover.pixmap: close-unfocus-hover.png
window.close.pressed.pixmap: close-pressed.png
window.iconify.pixmap: iconify-focus.png
window.iconify.unfocus.pixmap: iconify-unfocus.png
window.iconify.hover.pixmap: iconify-hover.png
window.iconify.unfocus.hover.pixmap: iconify-unfocus-hover.png
window.iconify.pressed.pixmap: iconify-pressed.png
window.maximize.pixmap: maximize-focus.png
window.maximize.unfocus.pixmap: maximize-unfocus.png
window.maximize.hover.pixmap: maximize-hover.png
window.maximize.unfocus.hover.pixmap: maximize-unfocus-hover.png
window.maximize.pressed.pixmap: maximize-pressed.png

window.restore.pixmap: restore-focus.png
window.restore.unfocus.pixmap: restore-unfocus.png
window.restore.hover.pixmap: restore-hover.png
window.restore.unfocus.hover.pixmap: restore-unfocus-hover.png
window.restore.pressed.pixmap: restore-pressed.png

! taskbar
toolbar.height: 18
toolbar.bevelWidth: 0
toolbar.borderWidth: 3
toolbar.borderColor: #222222
toolbar: flat solid

toolbar.color: #222222
toolbar.clock: flat solid
toolbar.clock.color: #222222
toolbar.clock.textColor: white

toolbar.iconbar.empty: flat
toolbar.iconbar.empty.color: #222222

toolbar.iconbar.focused.borderWidth: 15
toolbar.iconbar.focused.borderColor: #222222
toolbar.iconbar.focused: flat
toolbar.iconbar.focused.color: #dddddd
toolbar.iconbar.focused.textColor: #282828
toolbar.iconbar.focused.justify: left

toolbar.iconbar.unfocused.borderWidth: 15
toolbar.iconbar.unfocused.borderColor: #222222
toolbar.iconbar.unfocused: flat
toolbar.iconbar.unfocused.color: #444444
toolbar.iconbar.unfocused.textColor: white
toolbar.iconbar.unfocused.justify: left

toolbar.button: flat solid
toolbar.button.borderWidth: 13
toolbar.button.borderColor: #222222
toolbar.button.color: #222222
toolbar.button.picColor: #61CA00
toolbar.button.pressed: flat solid

! menu
menu.title: flat solid
menu.title.color: #63b4fb
menu.title.textColor: #282828
menu.title.justify: center

menu.bevelWidth: 4
menu.borderWidth: 6
menu.borderColor: #63b4fb

menu.frame: flat solid
menu.frame.disableColor: #999999
menu.frame.color: #ebebeb
menu.frame.textColor: #282828
menu.frame.justify: left

menu.hilite: flat solid
menu.hilite.textColor: #ffffff
menu.hilite.color: #63b4fb

menu.bullet: empty
menu.bullet.position: right
menu.itemHeight: 24
