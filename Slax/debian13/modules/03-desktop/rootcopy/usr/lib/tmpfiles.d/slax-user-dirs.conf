# Restore shared-folder ACLs at boot; SquashFS does not preserve POSIX ACLs.
a+ /root - - - - u::rwx,u:guest:--x,g::---,m::--x,o::---
d /root/Desktop 0700 root root -
a+ /root/Desktop - - - - u:guest:rwx,m::rwx,d:u:guest:rwx,d:g::---,d:m::rwx,d:o::---
d /root/Documents 0700 root root -
a+ /root/Documents - - - - u:guest:rwx,m::rwx,d:u:guest:rwx,d:g::---,d:m::rwx,d:o::---
d /root/Downloads 0700 root root -
a+ /root/Downloads - - - - u:guest:rwx,m::rwx,d:u:guest:rwx,d:g::---,d:m::rwx,d:o::---
d /root/Music 0700 root root -
a+ /root/Music - - - - u:guest:rwx,m::rwx,d:u:guest:rwx,d:g::---,d:m::rwx,d:o::---
d /root/Pictures 0700 root root -
a+ /root/Pictures - - - - u:guest:rwx,m::rwx,d:u:guest:rwx,d:g::---,d:m::rwx,d:o::---
d /root/Public 0700 root root -
a+ /root/Public - - - - u:guest:rwx,m::rwx,d:u:guest:rwx,d:g::---,d:m::rwx,d:o::---
d /root/Templates 0700 root root -
a+ /root/Templates - - - - u:guest:rwx,m::rwx,d:u:guest:rwx,d:g::---,d:m::rwx,d:o::---
d /root/Videos 0700 root root -
