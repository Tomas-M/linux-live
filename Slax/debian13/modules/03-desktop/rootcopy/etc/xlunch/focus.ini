# Slax launcher profile: application categories and Session share the main grid.
[ui]
mode = focus
scale = 1
margin = 28
padding = 0

[entries]
source = desktop

[desktop]
launcher = fbstartupnotify
launcher_args = gio,launch

[icons]
theme = hicolor
color = 

[fonts]
entries = DejaVuSans/10
body = DejaVuSans/12
small = DejaVuSans/10
header = DejaVuSans-Bold/18
heading = DejaVuSans/15
search = DejaVuSans/12
sidebar = DejaVuSans/12
footer = DejaVuSans/10

[colors]
text = ffffffff
muted = ffffffb3
surface = ffffff32
border = ffffff20
accent = ffffffff
hover = ffffff32
selected = ffffff32
selected_border = 00000000
focus_border = ffffff50

[labels]
confirm_title = Confirm action
confirm_accept = Continue
confirm_cancel = Cancel

[background]
color = 101010ff
use_root = true
image = 
placement = fill
overlay = 00000066
blur = 0

[header]
visible = true
text = Slax
text_color = ffffffff
icon = /usr/share/icons/hicolor/128x128/apps/slax.png
icon_size = 36
caption =
gap = 12
padding = 16
background = 00000000
separator_width = 0

[sidebar]
visible = true
width = 176
padding = 12
gap = 6
item_height = 44
item_padding = 12
item_radius = 8
item_border_width = 1
item_border = 00000000
hover_background = 00000000
hover_border = ffffff50
selected_background = ffffff32
selected_border = 00000000
icon_size = 16
show_labels = true
show_counts = false
separator_after = all
separator_before_session = true
order = all,favorites,groups,other
background = 00000000

[navigation.all]
visible = true
label = All apps
icon = /usr/share/xlunch/focus-icons/grid-2x2-symbolic.svg

[navigation.favorites]
visible = false
label = Favorites
icon = /usr/share/xlunch/focus-icons/pin-symbolic.svg

[navigation.other]
visible = true
label = Other
icon = /usr/share/xlunch/focus-icons/folder-symbolic.svg

[groups]
visible = true
show_empty = false
order = utility,development,education,games,graphics,internet,media,office,science,system

[group.internet]
label = Internet
icon = /usr/share/xlunch/focus-icons/globe-symbolic.svg
categories = Network

[group.office]
label = Office
icon = /usr/share/xlunch/focus-icons/file-text-symbolic.svg
categories = Office

[group.graphics]
label = Graphics
icon = /usr/share/xlunch/focus-icons/palette-symbolic.svg
categories = Graphics

[group.media]
label = Media
icon = /usr/share/xlunch/focus-icons/headphones-symbolic.svg
categories = AudioVideo,Audio,Video

[group.development]
label = Development
icon = /usr/share/xlunch/focus-icons/code-xml-symbolic.svg
categories = Development

[group.system]
label = System
icon = /usr/share/xlunch/focus-icons/settings-2-symbolic.svg
categories = System,Settings

[group.education]
label = Education
icon = /usr/share/xlunch/focus-icons/graduation-cap-symbolic.svg
categories = Education

[group.games]
label = Games
icon = /usr/share/xlunch/focus-icons/gamepad-2-symbolic.svg
categories = Game

[group.science]
label = Science
icon = /usr/share/xlunch/focus-icons/flask-conical-symbolic.svg
categories = Science

[favorites]
ids = chromium.desktop,debian-xterm.desktop,pcmanfm.desktop,SciTE.desktop
empty_text = No favorite applications available

[search]
enabled = true
visible = true
placeholder = Search apps or run a command
icon = /usr/share/xlunch/focus-icons/search-symbolic.svg
scope = all
height = 60
padding = 16
radius = 8
border_width = 0
background = ffffff12
show_shortcut = true
allow_commands = true
command_prefix =
command_launcher = fbcommand

[heading]
visible = true
all_text = All applications
search_text = Search results
show_count = false
count_text = Apps: {count}
empty_text = No applications found
gap = 16

[grid]
visible = true
columns = 0
tile_min_width = 140
tile_min_height = 128
gap_x = 14
gap_y = 14
fade_height = 64
padding = 12
icon_size = 64
icon_text_gap = 10
uninstalled_icon_transparency = 50
installed_first = true
label_lines = 1
tile_radius = 10
tile_border_width = 0
tile_background = 00000000
tile_border = 00000000
hover_background = ffffff32
selected_border = 00000000

[scroll]
enabled = true
smooth = true
duration = 120
wheel_step = 72

[scrollbar]
visible = true
width = 8
hit_width = 20
margin = 16
inset = 8
radius = 4
min_thumb_height = 24
track = ffffff20
thumb = ffffffa0
thumb_hover = ffffffc0
thumb_drag = ffffffff

[footer]
visible = true
align = grid
bottom_margin = 0
show_selection = true
show_description = true
show_shortcuts = true
select_text = Select
open_text = Open
close_text = Close
padding = 16
separator_width = 1
background = 00000000
key_background = ffffff10
key_border = ffffff60
key_padding = 4
key_radius = 4
key_border_width = 1
key_gap = 6
shortcut_gap = 16

[session]
visible = true
item_border_width = 1
item_border = 00000000
hover_background = 00000000
hover_border = ffffff50
selected_background = ffffff32
selected_border = 00000000
label = Session
icon = /usr/share/xlunch/focus-icons/power-symbolic.svg
view = grid
items = logout,restart,shutdown
padding = 12
gap = 8
radius = 10
background = ffffff32
margin_top = 0
count_text = {count} items

[action.logout]
label = Logout
icon = /usr/share/icons/hicolor/128x128/actions/logout.png
command = aplay /usr/share/sounds/shutdown.wav; killall Xorg
confirm = false

[action.restart]
label = Restart
icon = /usr/share/icons/hicolor/128x128/actions/restart.png
command = aplay /usr/share/sounds/shutdown.wav; reboot
confirm = false
confirm_text = Restart Slax?

[action.shutdown]
label = Shut down
icon = /usr/share/icons/hicolor/128x128/actions/shutdown.png
command = aplay /usr/share/sounds/shutdown.wav; poweroff
confirm = false
confirm_text = Shut down Slax?

[group.utility]
label = Accessories
icon = /usr/share/xlunch/focus-icons/wrench-symbolic.svg
categories = Utility

