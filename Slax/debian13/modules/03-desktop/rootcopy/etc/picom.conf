# XRender keeps the desktop independent of OpenGL and GPU acceleration.
backend = "xrender";
vsync = true;
# Repaint the full frame to avoid stale pixels around moving translucent windows.
use-damage = false;
# Follow the window manager's active client, including explicit focus clearing.
use-ewmh-active-win = true;
xrender-round-top-only = true;
corner-radius = 0;
# One-pixel inset outline; native CSD corners match the shared Slax theme.
xrender-window-outline = true;
xrender-outline-active-color = "#7f8792";
xrender-outline-inactive-color = "#a6adb5";
xrender-outline-radius = 8;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
frame-opacity = 1;

# XRender's rectangular shadow masks do not follow the rounded window outline.
shadow = false;

# Minimize toward the current taskbar button, then reverse on restore.
# The window moves for 300 ms and is fully transparent at the midpoint.
rules = (
   {
      match = "!override_redirect && (window_type = 'normal' || window_type = 'dialog')";
      animations = (
         {
            triggers = ["minimize"];
            offset-x = { duration = 0.30; start = 0; end = "window-icon-x - window-x - window-width * window-icon-scale / 2"; };
            offset-y = { duration = 0.30; start = 0; end = "window-icon-y - window-y - window-height * window-icon-scale / 2"; };
            scale-x = { duration = 0.30; start = 1; end = "window-icon-scale"; };
            scale-y = { duration = 0.30; start = 1; end = "window-icon-scale"; };
            opacity = { duration = 0.15; start = "window-raw-opacity-before"; end = 0; };
         },
         {
            triggers = ["restore"];
            offset-x = { duration = 0.30; start = "window-icon-x - window-x - window-width * window-icon-scale / 2"; end = 0; };
            offset-y = { duration = 0.30; start = "window-icon-y - window-y - window-height * window-icon-scale / 2"; end = 0; };
            scale-x = { duration = 0.30; start = "window-icon-scale"; end = 1; };
            scale-y = { duration = 0.30; start = "window-icon-scale"; end = 1; };
            opacity = { duration = 0.15; delay = 0.15; start = 0; end = "window-raw-opacity"; };
         },
         {
            triggers = ["maximize"];
            suppressions = ["geometry"];
            # Keep the initial scale for one frame while the client paints its new layout.
            var-grow = { duration = 0.15; delay = 0.02; curve = "cubic-bezier(0.28, 0.15, 0.4, 1)"; start = 0.95; end = 1; };
            scale-x = "var-grow";
            scale-y = "var-grow";
            offset-x = "window-width * (1 - var-grow) / 2";
            offset-y = "window-height * (1 - var-grow) / 2";
         },
         {
            triggers = ["unmaximize"];
            suppressions = ["geometry"];
            var-shrink = { duration = 0.15; delay = 0.02; curve = "cubic-bezier(0.28, 0.15, 0.4, 1)"; start = 1.05; end = 1; };
            scale-x = "var-shrink";
            scale-y = "var-shrink";
            offset-x = "window-width * (1 - var-shrink) / 2";
            offset-y = "window-height * (1 - var-shrink) / 2";
         }
      );
   },
   { match = "!override_redirect && (window_type = 'normal' || window_type = 'dialog')"; outline = true; },
   { match = "window_type != 'normal' && window_type != 'dialog' && role != 'slax-keyboard-popup' && role != 'slax-volume-popup' && role != 'slax-status-popup' && role != 'slax-status-notification'"; fade = false; },
   { match = "role *= 'fluxbox-toolbar'"; opacity = 0.7; },
   { match = "class_g = 'Chromium'"; opacity = 1; },
   # Round WM frames and opaque windows that cannot draw transparent corners.
   { match = "!override_redirect && border_width > 0"; corner-radius = 8; },
   { match = "!override_redirect && !argb && (window_type = 'normal' || window_type = 'dialog')"; corner-radius = 8; },
   # Round regular Fluxbox menus; the title-bar window menu stays square.
   { match = "role = 'fluxbox-menu'"; corner-radius = 8; },
   { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"; corner-radius = 0; shadow = false; outline = false; },
   { match = "fullscreen"; corner-radius = 0; shadow = false; outline = false; },
   # Taskbar previews temporarily dim other applications without restacking them.
   { match = "_SLAX_PREVIEW_DIM@ = 1 && (window_type = 'normal' || window_type = 'dialog')"; opacity = 0.12; shadow = false; }
);
