# XRender keeps the desktop independent of OpenGL and GPU acceleration.
backend = "xrender";
vsync = true;
# Repaint the full frame to avoid stale pixels around moving translucent windows.
use-damage = false;
# Follow the window manager's active client, including explicit focus clearing.
use-ewmh-active-win = true;
xrender-round-top-only = true;
corner-radius = 0;
# One-pixel inset outline; native CSD corners match the shared Slax theme.
xrender-window-outline = true;
xrender-outline-active-color = "#7f8792";
xrender-outline-inactive-color = "#a6adb5";
xrender-outline-radius = 8;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
frame-opacity = 1;

# XRender's rectangular shadow masks do not follow the rounded window outline.
shadow = false;

rules = (
   { match = "!override_redirect && (window_type = 'normal' || window_type = 'dialog')"; outline = true; },
   { match = "window_type != 'normal' && window_type != 'dialog'"; fade = false; },
   { match = "role *= 'fluxbox-toolbar'"; opacity = 0.7; },
   { match = "class_g = 'Chromium'"; opacity = 1; },
   # Round WM frames and opaque windows that cannot draw transparent corners.
   { match = "!override_redirect && border_width > 0"; corner-radius = 8; },
   { match = "!override_redirect && !argb && (window_type = 'normal' || window_type = 'dialog')"; corner-radius = 8; },
   # Round regular Fluxbox menus; the title-bar window menu stays square.
   { match = "role = 'fluxbox-menu'"; corner-radius = 8; },
   { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"; corner-radius = 0; shadow = false; outline = false; },
   { match = "fullscreen"; corner-radius = 0; shadow = false; outline = false; },
   # Taskbar previews temporarily dim other applications without restacking them.
   { match = "_SLAX_PREVIEW_DIM@ = 1 && (window_type = 'normal' || window_type = 'dialog')"; opacity = 0.12; shadow = false; }
);
