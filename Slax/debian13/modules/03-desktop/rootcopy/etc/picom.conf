# XRender keeps the desktop independent of OpenGL and GPU acceleration.
backend = "xrender";
vsync = true;
# Repaint the full frame to avoid stale pixels around moving translucent windows.
use-damage = false;
xrender-round-top-only = true;
corner-radius = 0;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;
frame-opacity = 1;

shadow = false;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -8;

rules = (
   { match = "window_type = 'normal' || window_type = 'dialog'"; shadow = true; },
   { match = "window_type != 'normal' && window_type != 'dialog'"; fade = false; },
   { match = "window_type = 'dock'"; shadow = true; },
   { match = "role *= 'fluxbox-toolbar'"; opacity = 0.7; },
   { match = "class_g = 'Chromium'"; opacity = 1; },
   # Only server-decorated windows need a compositor corner mask.
   { match = "!override_redirect && border_width > 0"; corner-radius = 8; },
   { match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_HORZ' && _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"; corner-radius = 0; shadow = false; },
   { match = "fullscreen"; corner-radius = 0; shadow = false; }
);
