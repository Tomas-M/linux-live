[config]
bm_open_method=0

[volume]
mount_on_startup=1
mount_removable=1
autorun=1

[desktop]
wallpaper_mode=stretch
wallpaper_common=1
wallpaper=/usr/share/wallpapers/slax_wallpaper.jpg
desktop_bg=#010101
desktop_fg=#ffffff
desktop_shadow=#000000
desktop_font=Sans 10
show_wm_menu=0
show_documents=0
show_trash=0
show_mounts=0

[ui]
always_show_tabs=0
max_tab_chars=32
win_width=790
win_height=500
splitter_pos=180
media_in_new_tab=0
desktop_folder_new_win=0
change_tab_on_drop=1
close_on_unmount=1
focus_previous=1
side_pane_mode=places
view_mode=icon
show_hidden=0
sort=name;ascending;
toolbar=navigation;
show_statusbar=1
pathbar_mode_buttons=0
